[project]
name = "notion-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vozenilf", email = "vozenilf@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
notion-mcp = "notion_mcp:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
